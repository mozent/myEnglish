const T_R="閱讀理解 Reading Comprehension",T_I="慣用語克漏字 Idiom Cloze",T_G="初級文法 Grammar";
const Q=[
{t:T_R,q:"Why did Tom stay at home last Saturday?",o:["He was sick.","It was raining heavily.","He had a test.","His mother was angry."],a:1,
 h:"第 1 段第 2 句：「it was raining cats and dogs, so he stayed at home all morning.」",
 e:"文中說 raining cats and dogs（下傾盆大雨），所以他待在家。"},
{t:T_R,q:"What did Tom find in his bedroom?",o:["A letter from his friend.","A ticket to the village.","An old photo of his grandfather.","A new umbrella."],a:2,
 h:"第 1 段：「While he was cleaning, he found an old photo of …」",
 e:"打掃臥室時他發現一張爺爺的舊照片。"},
{t:T_R,q:"Where does Tom's grandfather live?",o:["In a small village near the sea.","In Taipei.","Next to the train station.","In a big city."],a:0,
 h:"第 1 段最後一句：「His grandfather lives in a small village …」",
 e:"爺爺住在海邊的小村莊；Taipei 是湯姆住的地方。"},
{t:T_R,q:"How did Tom feel at first on the train?",o:["Excited","Angry","Nervous","Sleepy"],a:2,
 h:"第 2 段：「At first, he felt ____ because he had never traveled alone.」",
 e:"因為從沒獨自旅行過，所以一開始他很緊張 (nervous)。"},
{t:T_R,q:"Who sat next to Tom and talked to him?",o:["A teacher","A nurse","A police officer","A bus driver"],a:1,
 h:"第 2 段：「She was a nurse, and she gave him some good advice …」",
 e:"坐在他旁邊的親切女士是一名護理師 (nurse)。"},
{t:T_R,q:"Why did Tom's grandfather bring an umbrella to the station?",o:["The sun was too hot.","He wanted to give it as a gift.","The rain was still falling lightly.","He forgot to put it at home."],a:2,
 h:"第 3 段第 1 句：「When the train arrived, the rain was light.」",
 e:"火車到站時雨還下得很小，所以爺爺帶傘去接他。"},
{t:T_R,q:"What happened to Tom's dumplings?",o:["They were delicious.","They looked very funny.","They were too salty.","They fell on the floor."],a:1,
 h:"第 3 段：「…but his dumplings looked very funny.」",
 e:"湯姆的水餃看起來很滑稽 (funny)，爺爺因此笑了。"},
{t:T_R,q:"What did Tom and his grandfather do after dinner?",o:["They watched TV.","They played cards.","They cleaned the kitchen.","They looked at the stars."],a:3,
 h:"第 4 段第 1 句：「After dinner, they sat outside and looked at …」",
 e:"晚餐後他們坐在外面看星星。"},
{t:T_R,q:"How does Tom feel at the end of the story?",o:["Happy and thankful","Tired and bored","Worried and shy","Sad and lonely"],a:0,
 h:"第 4 段：「Tom felt ____ and thankful.」",
 e:"文中直接寫 Tom felt happy and thankful。"},
{t:T_R,q:"Which is the best title for the story?",o:["Tom Learns to Cook","A Nurse on a Train","A Rainy Day at School","A Trip to See Grandpa"],a:3,
 h:"想想整篇故事的主軸：Tom 做了什麼決定？去了哪裡？",
 e:"整篇故事圍繞 Tom 搭火車去探望爺爺，故最適合的標題是 A Trip to See Grandpa。"},

{t:T_I,q:"Last Saturday it was raining ______, so Tom stayed at home.",o:["up and down","here and there","cats and dogs","black and white"],a:2,
 h:"第 1 段第 2 句。形容雨下得非常大的慣用語。",
 e:"rain cats and dogs = 下傾盆大雨。"},
{t:T_I,q:"To ______, the kind woman started a friendly talk with Tom.",o:["break a leg","break the ice","break the rule","break his heart"],a:1,
 h:"第 2 段：「Soon the ice was broken, and Tom felt much better.」",
 e:"break the ice = 打破僵局、讓初次見面的氣氛變輕鬆。break a leg 是「祝你好運」。"},
{t:T_I,q:"“You are late!” “______,” Tom answered with a smile.",o:["Time is money","Easy come, easy go","Better late than never","Out of sight, out of mind"],a:2,
 h:"第 3 段：Tom 對爺爺說「你遲到了」的回答。",
 e:"Better late than never = 遲到總比不到好。"},
{t:T_I,q:"Tom thought making dumplings would be ______, but it was not easy.",o:["a hot potato","a big cheese","a drop in the bucket","a piece of cake"],a:3,
 h:"第 3 段：「Tom thought it would be ____, but his dumplings looked very funny.」",
 e:"a piece of cake = 輕而易舉的事。"},
{t:T_I,q:"Tom lives far from his grandfather, so he sees him only ______.",o:["all the time","once in a blue moon","again and again","day by day"],a:1,
 h:"第 4 段：「I only see you ____.」表示「很少、難得」。",
 e:"once in a blue moon = 千載難逢、極少有。"},

{t:T_G,q:"Tom ______ a junior high school student.",o:["am","is","are","be"],a:1,
 h:"主詞 Tom 是第三人稱單數，現在式 be 動詞用哪一個？",
 e:"第三人稱單數主詞搭配 is。"},
{t:T_G,q:"Last Saturday, Tom ______ a bus to the train station.",o:["take","takes","took","taking"],a:2,
 h:"句子有 Last Saturday，表示過去的時間。",
 e:"過去式用 took（take 的不規則變化）。"},
{t:T_G,q:"Tom is ______ than his grandfather.",o:["youngest","young","more young","younger"],a:3,
 h:"出現 than，表示兩者比較；young 是單音節形容詞。",
 e:"單音節形容詞比較級加 -er：younger than。"},
{t:T_G,q:"There ______ many stars in the sky last night.",o:["is","were","was","are"],a:1,
 h:"stars 是複數名詞，且 last night 表示過去。",
 e:"複數名詞 + 過去式 → There were。"},
{t:T_G,q:"Tom felt nervous ______ he had never traveled alone.",o:["but","so","because","or"],a:2,
 h:"後半句說明前半句「緊張」的原因。",
 e:"because 引導原因：因為他從沒獨自旅行過。"}
];

/* ============ 狀態 ============ */
const LET=["A","B","C","D"];
let cur=0,okN=0,badN=0,ans=new Array(Q.length).fill(null),done=false;
const $=id=>document.getElementById(id);
const main=$("main");

function updateTop(){
  const n=done?Q.length:cur+1;
  $("prog").textContent=n+"/"+Q.length;
  $("cOk").textContent=okN;$("cBad").textContent=badN;
  $("barfill").style.width=((done?Q.length:cur)/Q.length*100)+"%";
}

function renderQ(){
  const q=Q[cur];
  main.innerHTML="";
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<span class="tag"></span><span class="qnum"></span><div class="stem"></div><div class="opts"></div>'+
  '<button class="hintbtn">💡 提示 (Hint)</button><div class="hint"></div><div class="fb"></div><button class="next"></button>';
  c.querySelector(".tag").textContent=q.t;
  c.querySelector(".qnum").textContent="Question "+(cur+1);
  c.querySelector(".stem").textContent=q.q;
  const box=c.querySelector(".opts");
  q.o.forEach((txt,i)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+LET[i]+"</b><span></span>";b.lastChild.textContent=txt;
    b.onclick=()=>pick(i,c);box.appendChild(b);
  });
  const hint=c.querySelector(".hint"),hb=c.querySelector(".hintbtn");
  hint.textContent=q.h;
  hb.onclick=()=>{const s=hint.classList.toggle("show");hb.textContent=s?"💡 收起提示":"💡 提示 (Hint)"};
  const nx=c.querySelector(".next");
  nx.textContent=cur===Q.length-1?"查看結果 →":"下一題 →";
  nx.onclick=()=>{if(cur===Q.length-1){done=true;renderResult()}else{cur++;renderQ()}updateTop();window.scrollTo({top:0,behavior:"smooth"})};
  main.appendChild(c);updateTop();
}

function pick(i,c){
  if(ans[cur]!==null)return;
  const q=Q[cur];ans[cur]=i;
  const opts=c.querySelectorAll(".opt");
  opts.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("correct");});
  const fb=c.querySelector(".fb");
  if(i===q.a){okN++;fb.className="fb show ok";fb.innerHTML="✓ 答對了！ <span></span>";}
  else{badN++;opts[i].classList.add("wrong");fb.className="fb show bad";fb.innerHTML="✕ 答錯了，正確答案是 <b>"+LET[q.a]+"</b>。 <span></span>";}
  fb.querySelector("span").textContent=q.e;
  c.querySelector(".next").classList.add("show");
  updateTop();
}

function renderResult(){
  const pct=Math.round(okN/Q.length*100);
  let msg=pct>=90?"太棒了！你已經掌握得很好 🎉":pct>=70?"表現不錯，再複習錯題會更好 👍":pct>=50?"還可以，建議重讀文章後再挑戰 📖":"別氣餒，先讀文章並善用提示再試一次 💪";
  main.innerHTML="";
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="score"><div class="big"></div><div class="sub"></div><div class="msg" style="margin-top:6px;font-weight:600"></div></div><div class="row"><button class="primary" id="again">🔄 重新測驗</button><button class="tbtn" id="again2">📖 閱讀文章</button></div><h3 style="margin-top:22px">各題複習清單</h3><div id="rev"></div>';
  c.querySelector(".big").textContent=okN+" / "+Q.length;
  c.querySelector(".sub").textContent="答對率 "+pct+"%　（✓ "+okN+"　✕ "+badN+"）";
  c.querySelector(".msg").textContent=msg;
  const rev=c.querySelector("#rev");
  Q.forEach((q,i)=>{
    const ok=ans[i]===q.a;
    const d=document.createElement("div");d.className="ritem";
    d.innerHTML='<div class="h"></div><div class="m"></div><div class="ex"></div>';
    d.querySelector(".h").textContent=(ok?"✓ ":"✕ ")+(i+1)+". "+q.q;
    const m=d.querySelector(".m");
    m.innerHTML='<span class="tag" style="margin:0 8px 0 0"></span><span class="you '+(ok?"ok":"bad")+'"></span> <span class="cor"></span>';
    m.querySelector(".tag").textContent=q.t;
    m.querySelector(".you").textContent="你的答案："+LET[ans[i]]+". "+q.o[ans[i]];
    m.querySelector(".cor").textContent=ok?"":"｜正確答案："+LET[q.a]+". "+q.o[q.a];
    d.querySelector(".ex").textContent="解析："+q.e+"　線索："+q.h;
    rev.appendChild(d);
  });
  main.appendChild(c);
  $("again").onclick=restart;$("again2").onclick=()=>openM("mStory");
  updateTop();
}
function restart(){cur=0;okN=0;badN=0;ans.fill(null);done=false;renderQ();window.scrollTo({top:0})}

/* ============ Modal ============ */
function openM(id){$(id).classList.add("open");hideTip();}
function closeM(el){el.classList.remove("open");hideTip();if(el.id==="mStory")stopSpeak();}
document.querySelectorAll(".mback").forEach(m=>{
  m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))closeM(m)});
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){hideTip();document.querySelectorAll(".mback.open").forEach(closeM)}});
$("btnStory").onclick=()=>openM("mStory");
$("btnZh").onclick=()=>openM("mZh");

/* ============ 故事渲染（藍底單字 + 逐字朗讀用）============ */
let wordEls=[];
function renderStory(){
  const el=$("storyBody");el.innerHTML="";wordEls=[];let offset=0;
  STORY.forEach(p=>{
    const pe=document.createElement("p");let last=0,m;const re=/[A-Za-z]+(?:'[A-Za-z]+)?/g;
    while((m=re.exec(p))){
      if(m.index>last)pe.appendChild(document.createTextNode(p.slice(last,m.index)));
      const s=document.createElement("span");s.className="w";s.textContent=m[0];
      const k=lookup(m[0]);if(k){s.classList.add("vocab");s.dataset.k=k;}
      wordEls.push({el:s,start:offset+m.index});
      pe.appendChild(s);last=m.index+m[0].length;
    }
    pe.appendChild(document.createTextNode(p.slice(last)));
    el.appendChild(pe);offset+=p.length+1;
  });
}
function renderZh(){
  const el=$("zhBody");el.innerHTML="";
  STORY.forEach((p,i)=>{
    const a=document.createElement("p");a.textContent=p;
    const b=document.createElement("p");b.className="zh";b.textContent=ZH[i];
    el.appendChild(a);el.appendChild(b);
  });
}

/* ============ 單字 tooltip ============ */
const tip=$("tip");
function speakWord(t){
  if(!("speechSynthesis" in window))return;
  stopSpeak();
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;const v=pickVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function showTip(span){
  const k=span.dataset.k,d=D[k];if(!d)return;
  tip.innerHTML='<div class="t1"><span class="wd"></span><span class="ipa"></span><button class="snd" title="發音">🔊</button><span class="pos"></span></div><div class="zhm"></div><div class="ex"><div class="en"></div><div class="exz"></div></div>';
  tip.querySelector(".wd").textContent=k;
  tip.querySelector(".ipa").textContent=d[2];
  tip.querySelector(".pos").textContent=d[0];
  tip.querySelector(".zhm").textContent=d[1];
  tip.querySelector(".en").textContent=d[3];
  tip.querySelector(".exz").textContent=d[4];
  tip.querySelector(".snd").onclick=e=>{e.stopPropagation();speakWord(k)};
  tip.style.display="block";
  const r=span.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-tw-8);
  let top=r.bottom+8;if(top+th>window.innerHeight-8)top=Math.max(8,r.top-th-8);
  tip.style.left=left+"px";tip.style.top=top+"px";
  speakWord(k);
}
function hideTip(){tip.style.display="none"}
document.addEventListener("click",e=>{
  const w=e.target.closest(".vocab");
  if(w){showTip(w);return;}
  if(!e.target.closest("#tip"))hideTip();
});

/* ============ 逐字朗讀 ============ */
let curW=-1,fbTimer=null,gotB=false,speaking=false,pausedFlag=false;
function pickVoice(){
  if(!("speechSynthesis" in window))return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/en-US/i.test(v.lang)&&/natural|google|samantha|aria|jenny/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{};}
function mark(i){
  if(i===curW)return;
  if(curW>=0&&wordEls[curW])wordEls[curW].el.classList.remove("speaking");
  curW=i;
  if(i>=0&&wordEls[i]){const el=wordEls[i].el;el.classList.add("speaking");
    const box=$("storyBody"),r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
    if(r.top<b.top+20||r.bottom>b.bottom-20)box.scrollTop+=r.top-b.top-b.height/3;}
}
function markAt(ci){let idx=0;for(let i=0;i<wordEls.length;i++){if(wordEls[i].start<=ci)idx=i;else break}mark(idx)}
function stopSpeak(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  clearInterval(fbTimer);fbTimer=null;speaking=false;pausedFlag=false;gotB=false;mark(-1);
  const p=$("ttsPause");if(p)p.textContent="⏸ 暫停";
}
function playStory(){
  if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音朗讀。");return;}
  stopSpeak();
  const rate=parseFloat($("ttsRate").value);
  const u=new SpeechSynthesisUtterance(FULL);u.lang="en-US";u.rate=rate;
  const v=pickVoice();if(v)u.voice=v;
  u.onboundary=e=>{if(e.name&&e.name!=="word")return;gotB=true;clearInterval(fbTimer);fbTimer=null;markAt(e.charIndex)};
  u.onend=()=>{clearInterval(fbTimer);fbTimer=null;speaking=false;mark(-1)};
  u.onerror=()=>{clearInterval(fbTimer);fbTimer=null;speaking=false;mark(-1)};
  speaking=true;speechSynthesis.speak(u);
  /* 備援：若瀏覽器不回報 boundary 事件，依語速估算逐字高亮 */
  setTimeout(()=>{
    if(speaking&&!gotB&&!fbTimer){
      let i=0;mark(0);
      fbTimer=setInterval(()=>{if(pausedFlag)return;i++;if(i>=wordEls.length){clearInterval(fbTimer);fbTimer=null;return}mark(i)},Math.round(400/rate));
    }
  },1500);
}
$("ttsPlay").onclick=playStory;
$("ttsStop").onclick=stopSpeak;
$("ttsPause").onclick=()=>{
  if(!speaking||!("speechSynthesis" in window))return;
  if(!pausedFlag){speechSynthesis.pause();pausedFlag=true;$("ttsPause").textContent="▶ 繼續";}
  else{speechSynthesis.resume();pausedFlag=false;$("ttsPause").textContent="⏸ 暫停";}
};

/* ============ 啟動 ============ */
renderStory();renderZh();renderQ();
</script>
